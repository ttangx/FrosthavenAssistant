AWSTemplateFormatVersion: '2010-09-09'
Description: Frosthaven Assistant - Game Server + Web Player UI on EC2

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route53 hosted zone ID for the domain
  DomainName:
    Type: String
    Description: Full domain name for the server
    Default: fh.epicbroccoli.com
  ServerPort:
    Type: Number
    Default: 4567
    Description: TCP port the game server listens on
  InstanceType:
    Type: String
    Default: t4g.micro
    Description: EC2 instance type (ARM64 Graviton)
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 ARM64 AMI (resolved via SSM parameter)

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: frosthaven-server-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Frosthaven Assistant Server
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ServerPort
          ToPort: !Ref ServerPort
          CidrIp: 0.0.0.0/0
          Description: Game server TCP (Flutter clients)
        - IpProtocol: tcp
          FromPort: !Ref ServerPort
          ToPort: !Ref ServerPort
          CidrIpv6: ::/0
          Description: Game server TCP IPv6
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Web UI + WebSocket
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: ::/0
          Description: Web UI + WebSocket IPv6
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
          Description: HTTPS IPv6
      Tags:
        - Key: Name
          Value: frosthaven-server

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: frosthaven-server
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail
          exec > /var/log/frosthaven-setup.log 2>&1
          export HOME=/root
          export PUB_CACHE=/root/.pub-cache

          echo "=== Installing Dart SDK ==="
          apt-get update
          apt-get install -y wget git unzip

          wget -q https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-linux-arm64-release.zip -O /tmp/dart-sdk.zip
          unzip -q /tmp/dart-sdk.zip -d /opt

          echo "=== Installing Node.js ==="
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

          echo "=== Cloning repository ==="
          mkdir -p /opt/frosthaven/web
          cd /tmp
          git clone --depth 1 https://github.com/Tarmslitaren/FrosthavenAssistant.git

          echo "=== Building game server ==="
          cd /tmp/FrosthavenAssistant/frosthaven_assistant_server
          /opt/dart-sdk/bin/dart pub get
          /opt/dart-sdk/bin/dart compile exe lib/main.dart -o /opt/frosthaven/server

          echo "=== Building web player UI ==="
          cd /tmp/FrosthavenAssistant/web-player-ui
          npm ci
          npm run build
          cp -r dist/* /opt/frosthaven/web/

          echo "=== Installing systemd service ==="
          cat > /etc/systemd/system/frosthaven-server.service <<'UNIT'
          [Unit]
          Description=Frosthaven Assistant Game Server
          After=network.target

          [Service]
          Type=simple
          ExecStart=/opt/frosthaven/server
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=frosthaven-server

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable frosthaven-server
          systemctl start frosthaven-server

          echo "=== Installing SSM Agent ==="
          snap install amazon-ssm-agent --classic
          snap start amazon-ssm-agent

          echo "=== Cleanup ==="
          rm -rf /tmp/FrosthavenAssistant

          echo "=== Done ==="

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: frosthaven-server

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref Instance
      AllocationId: !GetAtt ElasticIP.AllocationId

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: '300'
      ResourceRecords:
        - !Ref ElasticIP

Outputs:
  PublicIP:
    Description: Elastic IP address of the server
    Value: !Ref ElasticIP
  Domain:
    Description: Domain name for the server
    Value: !Ref DomainName
  WebUI:
    Description: Web player UI URL
    Value: !Sub 'http://${DomainName}'
  WebSocket:
    Description: WebSocket endpoint
    Value: !Sub 'ws://${DomainName}/ws'
  FlutterConnection:
    Description: What to enter in the Flutter app
    Value: !Sub '${DomainName}:${ServerPort}'
